<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | NFT preview card component</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">
    <div class="card__images">
      <img src="assets/image-equilibrium.jpg" alt="Equilibrium NFT" class="card__product-img">
      <div class="card__images-layer">
        <img src="assets/icon-view.svg" alt="view icon">
      </div>
    </div>

    <div class="card__title">
      <h1>Equilibrium #3429</h1>
    </div>

    <p class="card__description" id="info">Our Equilibrium collection promotes balance and calm.</p>

    <div class="card__time">
      <div class="card__time-left">
        <img src="assets/icon-ethereum.svg" alt="Ethereum icon">
        <span>0.041 ETH</span>
      </div>
      <div class="card__time-right">
        <img src="assets/icon-clock.svg" alt="Clock icon">
        <span>3 days left</span>
      </div>
    </div>

    <hr class="card__divider">

    <div class="card__creator">
      <img src="assets/image-avatar.jpg" alt="Creation of Ketan Makode" class="card__creator-img">
      <p class="card__creator-text">Creation of <a href="https://www.github.com/ImKetan1610" target="_blank"
          rel="noopener" class="card__creator-name">Ketan Makode</a></p>
    </div>
  </main>

  <footer class="attribution">Challenge by <a href="https://www.crio.do" target="_blank" rel="noopener">Crio.Do</a>.
    Coded by <a href="https://www.github.com/ImKetan1610" target="_blank" rel="noopener">Ketan Makode</a>.</footer>

</body>

</html>
